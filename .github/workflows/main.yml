- name: Install dependencies
  working-directory: ./al_qadarif_app
  run: flutter pub get

- name: Build APK
  working-directory: ./al_qadarif_app
  run: flutter build apk --release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: al-qadarif-apk
    path: al_qadarif_app/build/app/outputs/flutter-apk/app-release.apk
